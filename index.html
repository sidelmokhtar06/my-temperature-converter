<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My temperature converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <h2>temperature conversion:</h2>
        <input type="text" id="TextBox" value="0"><br>
        <input type="radio" id="toCelsuis" name="unit">
        <label for="toCelsuis">Fahrenheit → Celsuis</label><br>
        <input type="radio" id="toFahrenheit" name="unit">
        <label for="toFahrenheit">Celsuis → Fahrenheit</label><br>
        <button type="button" onclick="convert()" >Submit</button>
        <p id="result">select a unit</p>

    </form>
    <script src="index.js"></script>
</body>

</html>
